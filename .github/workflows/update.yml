name: Refresh eSIM plans

# Paused 2026-11-05 while the site is rebuilt on the `rebuild` branch.
# A scheduled run would overwrite the holding page with the old table.
on:
  workflow_dispatch:        # manual runs only

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh data and rebuild site
        env:
          SITE_BASE_URL: https://esim-sorted.co.uk
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}   # set in repo Settings → Secrets → Actions
        run: |
          python scripts/update_plans.py
          python scripts/build_static.py

      - name: Commit changes
        run: |
          git config user.name "esim-sorted-bot"
          git config user.email "bot@users.noreply.github.com"
          git add plans.json sitemap.xml '*.html'   # quoted glob matches subdirectories too
          git commit -m "Daily refresh $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
