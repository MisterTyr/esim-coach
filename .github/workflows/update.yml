name: Refresh eSIM plans

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh data and rebuild site
        env:
          SITE_BASE_URL: https://esim.coach
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}   # set in repo Settings → Secrets → Actions
        run: |
          python scripts/update_plans.py
          python scripts/build_static.py

      - name: Commit changes
        run: |
          git config user.name "esim-coach-bot"
          git config user.email "bot@users.noreply.github.com"
          git add plans.json sitemap.xml index.html *.html
          git commit -m "Daily refresh $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
